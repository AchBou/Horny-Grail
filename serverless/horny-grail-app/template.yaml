AWSTemplateFormatVersion: 2010-09-09
Description: >-
  horny-grail-app
Transform:
- AWS::Serverless-2016-10-31

Parameters:
  LookupTableName:
    Type: String
    Description: Name of the DynamoDB table managed by this stack
    Default: horny-grail-name-lookup
  FrontendBucketName:
    Type: String
    Description: Name of the frontend S3 bucket used as the protected CloudFront origin
    Default: your-frontend-bucket-name
  BucketName:
    Type: String
    Description: Existing S3 bucket used for full images and thumbnails
    Default: your-upload-bucket-name
  BucketRegion:
    Type: String
    Description: AWS region of the existing S3 bucket used for uploads
    Default: us-west-2
  AppSecretsSecretArn:
    Type: String
    Description: Secrets Manager secret ARN containing writeApiKey, readAccessCode, readOriginSecret, and mobileReadTokenSecret JSON fields
    NoEcho: true
  MobileReadTokenTtlSeconds:
    Type: Number
    Description: Number of seconds a mobile read session token remains valid
    Default: 3600
  MobileSignedUrlTtlSeconds:
    Type: Number
    Description: Number of seconds signed media URLs returned to the mobile app remain valid
    Default: 900
  CloudFrontPublicKeyParameterName:
    Type: String
    Description: SSM parameter name containing the PEM encoded RSA public key paired with the private key in Secrets Manager
  CloudFrontPrivateKeySecretArn:
    Type: String
    Description: Secrets Manager secret ARN containing the RSA private key PEM used to sign CloudFront cookies
    NoEcho: true
  ProtectedReadAlias:
    Type: String
    Description: Custom hostname served by the protected CloudFront distribution
    Default: hornygrail.madebyach.dev
  ProtectedReadAcmCertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 for the protected CloudFront hostname
    Default: arn:aws:acm:us-east-1:480485137817:certificate/1d08b612-8945-479e-971c-263b292d183a
  AccessCookieTtlSeconds:
    Type: Number
    Description: Number of seconds a successful access-code session remains valid
    Default: 3600
  CloudFrontCookieResource:
    Type: String
    Description: CloudFront signed-cookie resource scope. Use https://*/* for first deploy, then restrict to your protected domain if desired.
    Default: https://hornygrail.madebyach.dev/*
  AllowedCorsOrigins:
    Type: String
    Description: Comma-separated list of allowed CORS origins
    Default: http://localhost:5173,http://localhost:1420
  LoginGlobalFailuresPerHour:
    Type: Number
    Description: Wrong access codes per hour (from anyone) before every login pauses for an hour
    Default: 20
    MinValue: 1
  BudgetAlertEmail:
    Type: String
    Description: Email address for the monthly AWS budget alert. Leave empty to skip creating the budget.
    Default: ''
  MonthlyBudgetUsd:
    Type: Number
    Description: Monthly AWS spend (USD) that triggers the budget alert email
    Default: 5
    MinValue: 1

Conditions:
  HasBudgetAlertEmail: !Not [!Equals [!Ref BudgetAlertEmail, '']]

Resources:
  # Data store for image metadata and randomized browse.
  LookupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref LookupTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: randomKey
        AttributeType: N
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: RandomImageIndex
        KeySchema:
        - AttributeName: status
          KeyType: HASH
        - AttributeName: randomKey
          KeyType: RANGE
        Projection:
          ProjectionType: ALL

  # Failed-login counters and lockouts for the access-code endpoints. Rows expire via TTL.
  LoginAttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-login-attempts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Emails when monthly AWS spend is on track to pass MonthlyBudgetUsd.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 80
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address: !Ref BudgetAlertEmail
      - Notification:
          NotificationType: FORECASTED
          ComparisonOperator: GREATER_THAN
          Threshold: 100
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address: !Ref BudgetAlertEmail

  ProtectedReadStaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-protected-read-static
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  ProtectedReadApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-protected-read-api
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Origin
              - Access-Control-Request-Headers
              - Access-Control-Request-Method
              - Content-Type
              - x-api-key
          QueryStringsConfig:
            QueryStringBehavior: all
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  ProtectedReadApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${AWS::StackName}-protected-read-api
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
            - Content-Type
            - x-api-key
        QueryStringsConfig:
          QueryStringBehavior: all

  ProtectedReadAuthCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-protected-read-auth
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: whitelist
            Cookies:
              - CloudFront-Policy
              - CloudFront-Signature
              - CloudFront-Key-Pair-Id
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Origin
              - Access-Control-Request-Headers
              - Access-Control-Request-Method
              - Content-Type
          QueryStringsConfig:
            QueryStringBehavior: all
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  # Edge resources that protect the static frontend, API, and media with signed cookies.
  ProtectedReadPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub ${AWS::StackName}-protected-read-key
        Comment: Public key used by CloudFront to verify HornyGrail access cookies
        EncodedKey: !Sub '{{resolve:ssm:${CloudFrontPublicKeyParameterName}}}'
        Name: !Sub ${AWS::StackName}-protected-read-key

  ProtectedReadKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Comment: Key group trusted by the HornyGrail protected read distribution
        Items:
          - !Ref ProtectedReadPublicKey
        Name: !Sub ${AWS::StackName}-protected-read-key-group

  ProtectedReadFrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-protected-read-frontend
        Description: Origin access control for the protected frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ProtectedReadMediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-protected-read-media
        Description: Origin access control for protected media objects
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ProtectedReadFrontendRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-protected-read-frontend-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrites access and SPA frontend routes for the protected frontend bucket
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri || '/';
          var cookies = request.cookies || {};
        
          function hasSignedAccessCookies() {
            return !!cookies['CloudFront-Policy']
              && !!cookies['CloudFront-Signature']
              && !!cookies['CloudFront-Key-Pair-Id'];
          }
        
          if (uri === '/access' || uri === '/access/') {
            request.uri = '/access.html';
            return request;
          }
        
          if (!hasSignedAccessCookies()) {
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: {
                location: {
                  value: '/access?next=' + encodeURIComponent(uri)
                },
                'cache-control': {
                  value: 'no-store'
                }
              }
            };
          }
        
          if (uri === '/' || uri === '') {
            return request;
          }
        
          if (uri.indexOf('.') === -1) {
            request.uri = '/200.html';
          }
        
          return request;
        }
  ProtectedReadSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref ProtectedReadAlias
        Comment: !Sub Protected static site, API, and media distribution for ${AWS::StackName}
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendOrigin
            DomainName: !Sub ${FrontendBucketName}.s3.${AWS::Region}.amazonaws.com
            OriginAccessControlId: !GetAtt ProtectedReadFrontendOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub ${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginCustomHeaders:
              - HeaderName: x-read-origin-secret
                HeaderValue: !Sub '{{resolve:secretsmanager:${AppSecretsSecretArn}:SecretString:readOriginSecret}}'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
          - Id: MediaOrigin
            DomainName: !Sub ${BucketName}.s3.${BucketRegion}.amazonaws.com
            OriginAccessControlId: !GetAtt ProtectedReadMediaOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref ProtectedReadStaticCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ProtectedReadFrontendRewriteFunction.FunctionARN
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - PathPattern: /_app/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadStaticCachePolicy
            Compress: true
            TargetOriginId: FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /favicon*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadStaticCachePolicy
            Compress: true
            TargetOriginId: FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /styles/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadStaticCachePolicy
            Compress: true
            TargetOriginId: FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /access*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadStaticCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ProtectedReadFrontendRewriteFunction.FunctionARN
            TargetOriginId: FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /auth/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadAuthCachePolicy
            Compress: true
            OriginRequestPolicyId: !Ref ProtectedReadApiOriginRequestPolicy
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /api/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadApiCachePolicy
            Compress: true
            OriginRequestPolicyId: !Ref ProtectedReadApiOriginRequestPolicy
            TargetOriginId: ApiOrigin
            TrustedKeyGroups:
              - !Ref ProtectedReadKeyGroup
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /files/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadStaticCachePolicy
            Compress: true
            TargetOriginId: MediaOrigin
            TrustedKeyGroups:
              - !Ref ProtectedReadKeyGroup
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /thumbnails/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ProtectedReadStaticCachePolicy
            Compress: true
            TargetOriginId: MediaOrigin
            TrustedKeyGroups:
              - !Ref ProtectedReadKeyGroup
            ViewerProtocolPolicy: redirect-to-https
        ViewerCertificate:
          AcmCertificateArn: !Ref ProtectedReadAcmCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  ProtectedReadFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowProtectedReadDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucketName}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ProtectedReadSiteDistribution}

  ProtectedReadMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Id: PolicyForCloudFrontProtectedMedia
        Statement:
          - Sid: AllowProtectedReadMediaDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub arn:aws:s3:::${BucketName}/files/*
              - !Sub arn:aws:s3:::${BucketName}/thumbnails/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ProtectedReadSiteDistribution}

  createAccessSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth/create-session.createSessionHandler
      Timeout: 10
      Description: Validates the shared access code and issues CloudFront signed cookies.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
          - !Ref CloudFrontPrivateKeySecretArn
          - !Sub '${AppSecretsSecretArn}*'
      - DynamoDBCrudPolicy:
          TableName: !Ref LoginAttemptsTable
      Environment:
        Variables:
          APP_SECRETS_SECRET_ARN: !Ref AppSecretsSecretArn
          LOGIN_ATTEMPTS_TABLE: !Ref LoginAttemptsTable
          LOGIN_GLOBAL_FAILURES_PER_HOUR: !Ref LoginGlobalFailuresPerHour
          CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: !Ref CloudFrontPrivateKeySecretArn
          CLOUDFRONT_KEY_PAIR_ID: !Ref ProtectedReadPublicKey
          CLOUDFRONT_COOKIE_RESOURCE: !Ref CloudFrontCookieResource
          ACCESS_COOKIE_TTL_SECONDS: !Ref AccessCookieTtlSeconds
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        AuthSessionPost:
          Type: HttpApi
          Properties:
            Path: /auth/session
            Method: POST
        AuthSessionGet:
          Type: HttpApi
          Properties:
            Path: /auth/session
            Method: GET
        AuthSessionOptions:
          Type: HttpApi
          Properties:
            Path: /auth/session
            Method: OPTIONS

  createMobileAccessSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth/create-mobile-session.createMobileSessionHandler
      Timeout: 10
      Description: Validates the shared access code and issues a short-lived mobile bearer token.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBCrudPolicy:
          TableName: !Ref LoginAttemptsTable
      Environment:
        Variables:
          APP_SECRETS_SECRET_ARN: !Ref AppSecretsSecretArn
          LOGIN_ATTEMPTS_TABLE: !Ref LoginAttemptsTable
          LOGIN_GLOBAL_FAILURES_PER_HOUR: !Ref LoginGlobalFailuresPerHour
          MOBILE_READ_TOKEN_TTL_SECONDS: !Ref MobileReadTokenTtlSeconds
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        AuthMobileSessionPost:
          Type: HttpApi
          Properties:
            Path: /auth/mobile/session
            Method: POST
        AuthMobileSessionOptions:
          Type: HttpApi
          Properties:
            Path: /auth/mobile/session
            Method: OPTIONS

  # Read handlers.
  getAllThumbnailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/thumbnails/get-all-thumbnails.getAllThumbnailsHandler
      Timeout: 100
      Description: Returns thumbnail metadata for the gallery.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBReadPolicy:
          TableName: !Ref LookupTable
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/thumbnails
            Method: GET

  getByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-by-id.getByIdHandler
      Timeout: 100
      Description: Returns image metadata by canonical content hash.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBReadPolicy:
          TableName: !Ref LookupTable
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/{id}
            Method: GET

  # Write handlers.
  putItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/put-item.putItemHandler
      Timeout: 100
      Description: Writes image metadata once the original and thumbnail are in S3.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBWritePolicy:
          TableName: !Ref LookupTable
      - DynamoDBReadPolicy:
          TableName: !Ref LookupTable
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
          - !Sub arn:aws:s3:::${BucketName}/files/*
          - !Sub arn:aws:s3:::${BucketName}/thumbnails/*
      - Statement:
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource: !Sub arn:aws:s3:::${BucketName}
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          BUCKET_NAME: !Ref BucketName
          BUCKET_REGION: !Ref BucketRegion
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api
            Method: POST
        ApiOptions:
          Type: HttpApi
          Properties:
            Path: /api
            Method: OPTIONS

  getAllItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-all-items.getAllItemsHandler
      Timeout: 100
      Description: Lists image metadata records.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBReadPolicy:
          TableName: !Ref LookupTable
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api
            Method: GET
        ApiTrailingSlash:
          Type: HttpApi
          Properties:
            Path: /api/
            Method: GET

  # Random discovery handlers.
  GetRandomImage:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/images/get-random-image.getRandomImageHandler
      Timeout: 60
      Description: Returns one random active image.
      Policies:
        - Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub '${AppSecretsSecretArn}*'
        - DynamoDBReadPolicy:
            TableName: !Ref LookupTable
        - Statement:
          - Effect: Allow
            Action:
            - dynamodb:Query
            Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LookupTable}/index/RandomImageIndex
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          BUCKET_NAME: !Ref BucketName
          BUCKET_REGION: !Ref BucketRegion
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/get-random-image
            Method: GET

  getRandomBrowseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/browse/get-random-browse.getRandomBrowseHandler
      Timeout: 60
      Description: Returns randomized browse pages with cursor pagination.
      Policies:
        - Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub '${AppSecretsSecretArn}*'
        - DynamoDBReadPolicy:
            TableName: !Ref LookupTable
        - Statement:
          - Effect: Allow
            Action:
            - dynamodb:Query
            Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LookupTable}/index/RandomImageIndex
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/browse/random
            Method: GET
  getMobileByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/mobile/get-by-id.getMobileByIdHandler
      Timeout: 100
      Description: Returns one mobile media item with signed original and thumbnail URLs.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBReadPolicy:
          TableName: !Ref LookupTable
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
          - !Sub arn:aws:s3:::${BucketName}/files/*
          - !Sub arn:aws:s3:::${BucketName}/thumbnails/*
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          BUCKET_NAME: !Ref BucketName
          BUCKET_REGION: !Ref BucketRegion
          MOBILE_READ_TOKEN_TTL_SECONDS: !Ref MobileReadTokenTtlSeconds
          MOBILE_SIGNED_URL_TTL_SECONDS: !Ref MobileSignedUrlTtlSeconds
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/mobile/{id}
            Method: GET
        ApiOptions:
          Type: HttpApi
          Properties:
            Path: /api/mobile/{id}
            Method: OPTIONS

  getMobileRandomBrowseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/mobile/get-random-browse.getMobileRandomBrowseHandler
      Timeout: 60
      Description: Returns randomized mobile browse pages with signed media URLs.
      Policies:
        - Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub '${AppSecretsSecretArn}*'
        - DynamoDBReadPolicy:
            TableName: !Ref LookupTable
        - Statement:
          - Effect: Allow
            Action:
            - dynamodb:Query
            Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LookupTable}/index/RandomImageIndex
        - Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
            - !Sub arn:aws:s3:::${BucketName}/files/*
            - !Sub arn:aws:s3:::${BucketName}/thumbnails/*
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          BUCKET_NAME: !Ref BucketName
          BUCKET_REGION: !Ref BucketRegion
          MOBILE_READ_TOKEN_TTL_SECONDS: !Ref MobileReadTokenTtlSeconds
          MOBILE_SIGNED_URL_TTL_SECONDS: !Ref MobileSignedUrlTtlSeconds
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/mobile/browse/random
            Method: GET
        ApiOptions:
          Type: HttpApi
          Properties:
            Path: /api/mobile/browse/random
            Method: OPTIONS

  # Upload and repair helpers.
  signUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/uploads/sign-upload.signUploadHandler
      Timeout: 30
      Description: Issues presigned upload URLs for originals and thumbnails.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - Statement:
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
          - !Sub arn:aws:s3:::${BucketName}/files/*
          - !Sub arn:aws:s3:::${BucketName}/thumbnails/*
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
          BUCKET_REGION: !Ref BucketRegion
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/uploads/sign
            Method: POST
        ApiOptions:
          Type: HttpApi
          Properties:
            Path: /api/uploads/sign
            Method: OPTIONS

  getAssetIntegrityFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/assets/get-asset-integrity.getAssetIntegrityHandler
      Timeout: 30
      Description: Checks whether metadata and expected S3 assets exist (desktop write key or mobile session).
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBReadPolicy:
          TableName: !Ref LookupTable
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
          - !Sub arn:aws:s3:::${BucketName}/files/*
          - !Sub arn:aws:s3:::${BucketName}/thumbnails/*
      - Statement:
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource: !Sub arn:aws:s3:::${BucketName}
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          BUCKET_NAME: !Ref BucketName
          BUCKET_REGION: !Ref BucketRegion
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/assets/{id}/integrity
            Method: GET
        ApiOptions:
          Type: HttpApi
          Properties:
            Path: /api/assets/{id}/integrity
            Method: OPTIONS

  deleteAssetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/assets/delete-asset.deleteAssetHandler
      Timeout: 30
      Description: Deletes a metadata entry from DynamoDB without removing S3 objects.
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: !Sub '${AppSecretsSecretArn}*'
      - DynamoDBCrudPolicy:
          TableName: !Ref LookupTable
      Environment:
        Variables:
          LOOKUP_TABLE: !Ref LookupTable
          CORS_ALLOWED_ORIGINS: !Ref AllowedCorsOrigins
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/assets/{id}
            Method: DELETE
        ApiOptions:
          Type: HttpApi
          Properties:
            Path: /api/assets/{id}
            Method: OPTIONS

Outputs:
  LookupTableName:
    Description: DynamoDB table name used for image metadata
    Value: !Ref LookupTable
  LoginAttemptsTableName:
    Description: DynamoDB table holding failed-login counters (used by npm run unlock-logins)
    Value: !Ref LoginAttemptsTable
  RandomImageIndexName:
    Description: DynamoDB GSI for random active image queries
    Value: RandomImageIndex
  WebEndpoint:
    Description: HTTP API default endpoint URL with /api base path
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/
  ProtectedReadDistributionId:
    Description: CloudFront distribution ID for the protected static site, API, and media entrypoint
    Value: !Ref ProtectedReadSiteDistribution
  ProtectedReadBaseUrl:
    Description: Base URL for the protected static frontend and media paths
    Value: !Sub https://${ProtectedReadAlias}
  ProtectedReadApiBaseUrl:
    Description: Base URL the public frontend should use for read API requests
    Value: !Sub https://${ProtectedReadAlias}/api
  ProtectedReadMediaBaseUrl:
    Description: Base URL the public frontend should use for image and thumbnail requests
    Value: !Sub https://${ProtectedReadAlias}

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 128
    Environment:
      Variables:
        APP_SECRETS_SECRET_ARN: !Ref AppSecretsSecretArn
    LoggingConfig:
      LogFormat: JSON
